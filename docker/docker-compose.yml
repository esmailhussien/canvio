services:
  web:
    build:
      context: ../
      dockerfile: docker/Dockerfile.web
    ports:
      - "5173:80"
    depends_on:
      - server
    environment:
      - VITE_API_URL=http://localhost:4000
      - VITE_WS_URL=ws://localhost:4001

  # Persistence is filesystem JSON + Yjs snapshots under CANVIO_DATA_DIR.
  # The previously provisioned postgres service was removed: no server code
  # reads DATABASE_URL.
  server:
    build:
      context: ../
      dockerfile: docker/Dockerfile.server
    ports:
      - "4000:4000"
      - "4001:4001"
    environment:
      - PORT=4000
      - WS_PORT=4001
      - CANVIO_DATA_DIR=/app/data
    volumes:
      - canvio-data:/app/data

volumes:
  canvio-data:
