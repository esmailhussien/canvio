<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Canvio is an online whiteboard and visual knowledge workspace for learning, planning, research, concept maps, connected notes, and shared ideas." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://canvio.space/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Canvio" />
    <meta property="og:title" content="Canvio | Online Whiteboard for Learning, Planning and Research" />
    <meta property="og:description" content="An online whiteboard for visual thinking, concept mapping, connected notes, and collaborative work." />
    <meta property="og:url" content="https://canvio.space/" />
    <meta property="og:image" content="https://canvio.space/logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Canvio | Online Whiteboard for Learning, Planning and Research" />
    <meta name="twitter:description" content="An online whiteboard for visual thinking, concept mapping, connected notes, and collaborative work." />
    <meta name="twitter:image" content="https://canvio.space/logo.png" />
    <meta name="theme-color" content="#6366f1" />
    <script>
      try {
        const preference = localStorage.getItem('canvio-theme-preference');
        const systemTheme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = preference === 'light' || preference === 'dark' ? preference : systemTheme;
      } catch (_) {}
    </script>
    <title>Canvio | Online Whiteboard for Learning, Planning and Research</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <script type="application/ld+json" id="canvio-seo-jsonld">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://canvio.space/#organization",
            "name": "Canvio",
            "url": "https://canvio.space",
            "logo": "https://canvio.space/logo.png",
            "sameAs": ["https://github.com/esmailhussien/canvio"]
          },

            "@type": "WebSite",
            "@id": "https://canvio.space/#website",
            "name": "Canvio",
            "url": "https://canvio.space",
            "description": "Canvio is an online whiteboard and visual knowledge workspace for learning, planning, research, concept maps, connected notes, and shared ideas.",
            "publisher": { "@id": "https://canvio.space/#organization" }
          },
          {
            "@type": "WebApplication",
            "@id": "https://canvio.space/#application",
            "name": "Canvio",
            "url": "https://canvio.space",
            "description": "Canvio is an online whiteboard and visual knowledge workspace for learning, planning, research, concept maps, connected notes, and shared ideas.",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Web",
            "browserRequirements": "Requires a modern web browser",

              "Infinite online whiteboard",

              "Presentation and export tools"
            ],
            "publisher": { "@id": "https://canvio.space/#organization" }
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

</html>
